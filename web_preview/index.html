<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reze Desktop Pet - Interactive Web Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0b18 0%, #1a122c 50%, #28183d 100%);
            --pet-bg: #181124;
            --accent-purple: #9d4edd;
            --accent-pink: #ff758f;
            --accent-bomb: #ff2a6d;
            --eye-green: #2ec4b6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #e0aaff, #ff758f, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header p {
            color: #b8c0e0;
            font-size: 0.95rem;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* TFT Display Hardware Simulator Frame */
        .device-frame {
            position: relative;
            width: 280px;
            height: 400px;
            background: #09060e;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(157, 78, 221, 0.3),
                        inset 0 0 15px rgba(255, 255, 255, 0.1);
            border: 3px solid #2e1e47;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .device-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #8a7a9e;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00f5d4;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f5d4;
        }

        .screen {
            position: relative;
            width: 240px;
            height: 320px;
            background: var(--pet-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #3d2b5c;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Speech Bubble overlay on screen */
        .speech-bubble {
            position: absolute;
            bottom: 12px;
            left: 10px;
            right: 10px;
            background: rgba(15, 10, 25, 0.88);
            border: 1px solid var(--accent-purple);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #e2d9f3;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        /* Control Panel Side */
        .control-panel {
            flex: 1;
            min-width: 320px;
            max-width: 450px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0aaff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(20, 15, 35, 0.8);
            border: 1px solid #4a366a;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), #7b2cbf);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
        }

        .btn-mic {
            background: linear-gradient(135deg, #ff758f, #ff477e);
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
            padding: 14px;
            font-size: 1rem;
        }

        .btn-mic:hover {
            box-shadow: 0 6px 20px rgba(255, 117, 143, 0.5);
        }

        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .emotion-btn {
            background: rgba(35, 25, 55, 0.7);
            border: 1px solid #4d3670;
            color: #d8c7ed;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .emotion-btn:hover {
            background: rgba(157, 78, 221, 0.3);
            border-color: var(--accent-purple);
            color: #fff;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #7b6f93;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌸 Reze Desktop Pet Simulator</h1>
        <p>Mô phỏng giao diện màn hình TFT ILI9341 240x320 & Phản hồi giọng nói Reze</p>
    </div>

    <div class="main-container">
        <!-- Device Frame -->
        <div class="device-frame">
            <div class="device-header">
                <span>ILI9341 240x320</span>
                <span style="display:flex; align-items:center; gap:5px;">
                    <span class="status-dot"></span> ESP32-C3
                </span>
            </div>

            <div class="screen">
                <canvas id="petCanvas" width="240" height="320"></canvas>
                <div class="speech-bubble" id="speechText">
                    "Xin chào! Mình là Reze đây~ ✨"
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="section-title">🎤 Thử nghiệm Giọng nói / Văn bản</div>
            
            <button class="btn btn-mic" id="micBtn" onclick="toggleWebMic()">
                🎙️ Lắng nghe Giọng nói (Web Speech)
            </button>

            <div class="input-group">
                <input type="text" id="userInput" placeholder="Nhập câu thoại (ví dụ: Chào Reze, Reze xinh quá)..." onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="sendInput()">Gửi</button>
            </div>

            <div class="section-title" style="margin-top:25px;">🎭 Biểu cảm Nút bấm Nhanh</div>
            <div class="emotion-grid">
                <button class="emotion-btn" onclick="triggerEmotion('HAPPY', 'Chào bạn nha! Hôm nay thế nào?')">😊 Happy (Hạnh phúc)</button>
                <button class="emotion-btn" onclick="triggerEmotion('SHY', 'Hè hè... Cảm ơn nhé, Reze ngại quá...')">😳 Shy (Ngượng phùng má)</button>
                <button class="emotion-btn" onclick="triggerEmotion('BOMB', 'Ta là Quỷ Bom Reze! BÙM!!! 💣')">💣 Bomb Mode (Quỷ Bom)</button>
                <button class="emotion-btn" onclick="triggerEmotion('SLEEPY', 'Oáp... Reze buồn ngủ rồi zZz')">😴 Sleepy (Đi ngủ)</button>
                <button class="emotion-btn" onclick="triggerEmotion('SURPRISED', 'Hả? Bạn vừa nói gì cơ?! 😮')">😮 Surprised (Bất ngờ)</button>
                <button class="emotion-btn" onclick="triggerEmotion('NEUTRAL', 'Mặt thản nhiên nháy mắt~')">😐 Neutral (Thản nhiên)</button>
            </div>
        </div>
    </div>

    <div class="footer">
        Dự án Reze Desktop Pet | ESP32 Hardware Companion
    </div>

    <script>
        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d');
        const speechText = document.getElementById('speechText');

        let currentEmotion = 'NEUTRAL';
        let blinkState = false;
        let blinkTimer = 0;
        let animationFrame;

        // Color Palette
        const COLORS = {
            bg: '#181124',
            hair: '#39225c',
            cheek: '#ff8fa3',
            eyeGreen: '#2ec4b6',
            bombRed: '#ff2a6d',
            white: '#ffffff',
            black: '#0a0512'
        };

        function renderFace() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, 240, 320);

            // Choker Ribbon
            ctx.fillStyle = COLORS.hair;
            ctx.beginPath();
            ctx.roundRect(80, 290, 80, 12, 6);
            ctx.fill();

            ctx.fillStyle = COLORS.bombRed;
            ctx.beginPath();
            ctx.arc(120, 296, 5, 0, Math.PI * 2);
            ctx.fill();

            const eyeY = 130;
            const leftX = 70;
            const rightX = 170;

            // Cheek Blush
            ctx.fillStyle = COLORS.cheek;
            const blushSize = (currentEmotion === 'SHY' || currentEmotion === 'HAPPY') ? 16 : 10;
            ctx.beginPath();
            ctx.ellipse(leftX - 15, eyeY + 42, blushSize, 8, 0, 0, Math.PI * 2);
            ctx.ellipse(rightX + 15, eyeY + 42, blushSize, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            if (blinkState || currentEmotion === 'SLEEPY') {
                ctx.strokeStyle = COLORS.hair;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(leftX - 20, eyeY);
                ctx.lineTo(leftX + 20, eyeY);
                ctx.moveTo(rightX - 20, eyeY);
                ctx.lineTo(rightX + 20, eyeY);
                ctx.stroke();
            } else if (currentEmotion === 'HAPPY') {
                ctx.strokeStyle = COLORS.hair;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(leftX, eyeY + 5, 20, Math.PI, 0);
                ctx.arc(rightX, eyeY + 5, 20, Math.PI, 0);
                ctx.stroke();
            } else if (currentEmotion === 'BOMB') {
                // Bomb eyes (Red glowing)
                ctx.fillStyle = COLORS.bombRed;
                ctx.beginPath();
                ctx.ellipse(leftX, eyeY, 24, 30, 0, 0, Math.PI * 2);
                ctx.ellipse(rightX, eyeY, 24, 30, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = COLORS.black;
                ctx.beginPath();
                ctx.arc(leftX, eyeY, 8, 0, Math.PI * 2);
                ctx.arc(rightX, eyeY, 8, 0, Math.PI * 2);
                ctx.fill();

                // Spark lines
                ctx.strokeStyle = COLORS.white;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(leftX - 25, eyeY - 15); ctx.lineTo(leftX - 10, eyeY - 5);
                ctx.moveTo(rightX + 25, eyeY - 15); ctx.lineTo(rightX + 10, eyeY - 5);
                ctx.stroke();
            } else {
                // Anime Emerald Eyes
                const eyeColor = (currentEmotion === 'SHY') ? COLORS.hair : COLORS.eyeGreen;
                
                // Outer Sclera
                ctx.fillStyle = COLORS.white;
                ctx.beginPath();
                ctx.ellipse(leftX, eyeY, 24, 32, 0, 0, Math.PI * 2);
                ctx.ellipse(rightX, eyeY, 24, 32, 0, 0, Math.PI * 2);
                ctx.fill();

                // Iris
                ctx.fillStyle = eyeColor;
                ctx.beginPath();
                ctx.ellipse(leftX, eyeY, 16, 26, 0, 0, Math.PI * 2);
                ctx.ellipse(rightX, eyeY, 16, 26, 0, 0, Math.PI * 2);
                ctx.fill();

                // Pupil & Highlights
                ctx.fillStyle = COLORS.black;
                ctx.beginPath();
                ctx.arc(leftX, eyeY + 2, 7, 0, Math.PI * 2);
                ctx.arc(rightX, eyeY + 2, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = COLORS.white;
                ctx.beginPath();
                ctx.arc(leftX - 6, eyeY - 8, 5, 0, Math.PI * 2);
                ctx.arc(rightX - 6, eyeY - 8, 5, 0, Math.PI * 2);
                ctx.arc(leftX + 5, eyeY + 8, 3, 0, Math.PI * 2);
                ctx.arc(rightX + 5, eyeY + 8, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eyelash Top Line
                ctx.strokeStyle = COLORS.hair;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(leftX - 25, eyeY - 32); ctx.lineTo(leftX + 25, eyeY - 32);
                ctx.moveTo(rightX - 25, eyeY - 32); ctx.lineTo(rightX + 25, eyeY - 32);
                ctx.stroke();
            }

            // Mouth
            const mouthY = eyeY + 55;
            ctx.fillStyle = COLORS.hair;
            ctx.strokeStyle = COLORS.hair;
            ctx.lineWidth = 3;

            if (currentEmotion === 'HAPPY') {
                ctx.beginPath();
                ctx.arc(120, mouthY - 5, 14, 0, Math.PI);
                ctx.fill();
            } else if (currentEmotion === 'TALKING') {
                ctx.beginPath();
                ctx.ellipse(120, mouthY, 10, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (currentEmotion === 'SURPRISED') {
                ctx.beginPath();
                ctx.arc(120, mouthY, 9, 0, Math.PI * 2);
                ctx.stroke();
            } else if (currentEmotion === 'BOMB') {
                ctx.strokeStyle = COLORS.bombRed;
                ctx.beginPath();
                ctx.moveTo(105, mouthY + 5); ctx.lineTo(120, mouthY); ctx.lineTo(135, mouthY + 5);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(120, mouthY - 8, 12, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.stroke();
            }
        }

        function triggerEmotion(emotion, text) {
            currentEmotion = emotion;
            speechText.innerText = text;
            renderFace();
        }

        // Auto Blink Loop
        setInterval(() => {
            blinkState = true;
            renderFace();
            setTimeout(() => {
                blinkState = false;
                renderFace();
            }, 150);
        }, 4000);

        function sendInput() {
            const val = document.getElementById('userInput').value.trim();
            if (!val) return;

            const valLower = val.toLowerCase();
            if (valLower.includes('chào') || valLower.includes('hi') || valLower.includes('dậy')) {
                triggerEmotion('HAPPY', `Hihi, chào bạn nhé! ("${val}")`);
            } else if (valLower.includes('xinh') || valLower.includes('đẹp') || valLower.includes('thích') || valLower.includes('yêu')) {
                triggerEmotion('SHY', `Reze ngại lắm đó... ("${val}")`);
            } else if (valLower.includes('bom') || valLower.includes('nổ') || valLower.includes('boom')) {
                triggerEmotion('BOMB', `Quỷ Bom Reze xuất kích! 💣 ("${val}")`);
            } else if (valLower.includes('ngủ') || valLower.includes('tối')) {
                triggerEmotion('SLEEPY', `Oáp... Chúc ngủ ngon! ("${val}")`);
            } else {
                triggerEmotion('TALKING', `Reze nghe thấy: "${val}" nè! ✨`);
            }
            document.getElementById('userInput').value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendInput();
        }

        // Web Speech API Voice Recognition
        function toggleWebMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Trình duyệt không hỗ trợ Web Speech API. Vui lòng dùng Google Chrome hoặc Edge!');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.start();

            const micBtn = document.getElementById('micBtn');
            micBtn.innerText = '🔴 Đang lắng nghe... Nói gì đó với Reze!';

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                sendInput();
                micBtn.innerText = '🎙️ Lắng nghe Giọng nói (Web Speech)';
            };

            recognition.onerror = () => {
                micBtn.innerText = '🎙️ Lắng nghe Giọng nói (Web Speech)';
            };
        }

        // Initial render
        renderFace();
    </script>
</body>
</html>
